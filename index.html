<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منو</title>
<style>
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#1a0f0a;color:#fff;font-family:Tahoma,sans-serif;text-align:center;padding:20px}
  a{color:#ffd9b4;font-size:16px}
  button{margin-top:14px;padding:12px 26px;border:0;border-radius:99px;background:#fe7b01;color:#1c0f08;font:700 15px Tahoma,sans-serif}
  .sp{width:34px;height:34px;margin:0 auto 14px;border:4px solid rgba(255,255,255,.2);border-top-color:#fe7b01;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
  <div class="sp" id="sp"></div>
  <p id="m">در حال اتصال به منو...</p>
  <div id="l"></div>
  <noscript>
    <p><a href="https://menuc1.ir/">menuc1.ir</a></p>
    <p><a href="https://menu4.servervnp23.workers.dev/">menu4.servervnp23.workers.dev</a></p>
  </noscript>
</div>
<script>
// آدرس‌های واقعی سایت (بدون / در انتها). ترتیب = اولویت.
var SITES = ["https://menuc1.ir", "https://menu4.servervnp23.workers.dev"];
var TIMEOUT = 12000;          // حداکثر انتظار برای مسابقهٔ کامل (میلی‌ثانیه)
var FAST = 3000;              // انتظار برای آدرسی که دفعهٔ قبل جواب داده بود
var KEEP = 6 * 3600 * 1000;   // انتخاب قبلی تا چند ساعت یادآوری شود

var done = false;
var suffix = location.search + location.hash;   // مثلا ?table=5 حفظ می‌شود

function save(u) { try { localStorage.setItem("gw", JSON.stringify({ u: u, t: Date.now() })); } catch (e) {} }
function saved() {
  try {
    var o = JSON.parse(localStorage.getItem("gw") || "null");
    return o && SITES.indexOf(o.u) > -1 && Date.now() - o.t < KEEP ? o.u : null;
  } catch (e) { return null; }
}
function ping(u, ms) {
  return new Promise(function (ok, no) {
    var c = new AbortController();
    var t = setTimeout(function () { c.abort(); }, ms);
    fetch(u + "/ping?_t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: c.signal })
      .then(function () { clearTimeout(t); ok(u); })
      .catch(function () { clearTimeout(t); no(u); });
  });
}
function go(u) {
  if (done) return;
  done = true;
  save(u);
  location.replace(u + "/" + suffix);
}
function showLinks() {
  document.getElementById("sp").style.display = "none";
  document.getElementById("m").textContent = "اتصال خودکار برقرار نشد؛ یکی از لینک‌ها را امتحان کن:";
  var box = document.getElementById("l");
  SITES.forEach(function (u) {
    var p = document.createElement("p"), a = document.createElement("a");
    a.href = u + "/" + suffix;
    a.textContent = u.replace("https://", "");
    p.appendChild(a);
    box.appendChild(p);
  });
  var b = document.createElement("button");
  b.textContent = "تلاش دوباره";
  b.onclick = function () { location.reload(); };
  box.appendChild(b);
}
function race() {
  var left = SITES.length;
  SITES.forEach(function (u) {
    ping(u, TIMEOUT).then(go).catch(function () {
      left--;
      if (left === 0 && !done) showLinks();
    });
  });
}

var s = saved();
if (s) ping(s, FAST).then(go).catch(race);   // مسیر سریع برای بازدید دوباره
else race();
</script>
</body>
</html>
