<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2b1d15">
<link rel="icon" href="data:,">
<title>منو</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#2b1d15;--hi:#3b2a1f;--lo:#1b120c;--tx:#f4e6d8;--mut:#b9a18c;--ac:#fe7b01}
  html,body{margin:0}
  body{
    min-height:100vh; min-height:100dvh;
    display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--tx);
    font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif; text-align:center;
  }
  .card{
    width:100%; max-width:380px; padding:36px 24px 28px;
    border-radius:30px; background:var(--bg);
    box-shadow:10px 10px 22px var(--lo),-10px -10px 22px var(--hi);
  }
  h1{font-size:21px; font-weight:700; margin:0 0 26px}

  /* حلقهٔ فرورفته با کمان نارنجی */
  .ring{
    position:relative; width:76px; height:76px; margin:0 auto 24px; border-radius:50%;
    box-shadow:inset 6px 6px 12px var(--lo),inset -6px -6px 12px var(--hi);
  }
  .ring::after{
    content:""; position:absolute; top:11px; right:11px; bottom:11px; left:11px;
    border-radius:50%; border:4px solid transparent; border-top-color:var(--ac);
    animation:spin .9s linear infinite;
  }
  .failed .ring::after{animation:none; border-top-color:var(--mut); opacity:.5}
  @keyframes spin{to{transform:rotate(360deg)}}

  #status{margin:0; min-height:25px; font-size:14px; line-height:1.8; color:var(--mut)}

  /* انتخاب دستی */
  .panel{display:none; margin-top:26px}
  .panel.on{display:block; animation:in .35s ease-out}
  @keyframes in{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .ask{margin:0 0 16px; font-size:15px; font-weight:700}
  .ops{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:16px}
  .btn{
    display:block; padding:15px 8px; border-radius:16px;
    background:var(--bg); color:var(--tx); text-decoration:none;
    font-size:15px; font-weight:700;
    box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);
    transition:box-shadow .15s,color .15s;
  }
  .btn:active{box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi); color:var(--ac)}
  .btn:focus-visible{outline:2px solid var(--ac); outline-offset:3px}
  .retry{margin-top:20px; font-size:14px; font-weight:400; color:var(--mut)}

  @media (prefers-reduced-motion:reduce){
    .ring::after{animation-duration:3s}
    .panel.on{animation:none}
  }
</style>
</head>
<body>
<main class="card">
  <h1 id="cafeName">منو</h1>
  <div class="ring" aria-hidden="true"></div>
  <p id="status" role="status" aria-live="polite">در حال پیدا کردن بهترین مسیر</p>
  <section id="panel" class="panel">
    <p class="ask">اینترنت گوشیت کدومه؟</p>
    <div class="ops" id="ops"></div>
    <a class="btn retry" id="retry" href="#">تلاش دوباره</a>
  </section>
</main>

<script>
/* =====================================================
   فقط این قسمت رو تغییر بده
   ===================================================== */

// اسم کافه (اختیاری). خالی بمونه، بالای صفحه فقط "منو" نوشته می‌شه
var CAFE_NAME = "";

// هر خط = یک اپراتور
//   name: اسمی که روی دکمهٔ انتخاب دستی نوشته می‌شه
//   url : آدرسی که برای اون اینترنت باز می‌شه
// ترتیب لیست = اولویت. همهٔ سایت‌ها همزمان پینگ می‌شن، ولی اگه سایت اولی جواب بده
// همون انتخاب می‌شه، حتی اگه سایت بعدی زودتر جواب داده باشه.
// پس سایتی که روی اون اینترنت درسته ولی شاید دیرتر جواب بده رو بالاتر بذار.
var SITES = [
  { name: "ایرانسل",   url: "https://menuc1.ir" },
  { name: "همراه اول", url: "https://www.menuc1.ir" }
];

// اگه فقط یه سایتِ کم‌اولویت جواب داد، این‌قدر (میلی‌ثانیه) صبر می‌کنه ببینه سایت‌های بالاتر هم جواب می‌دن یا نه.
// کمترش سریع‌تره ولی ممکنه سایت اشتباه انتخاب بشه. بیشترش دقیق‌تره ولی کندتر.
var GRACE_MS = 600;

// مسیر تست. بهتره یه آدرس خیلی سبک مثل "/ping" بسازی که فقط یه جواب خالی بده
// (مثلاً با ورکر کلادفلر). اگه نداری "/" بمونه.
var PING_PATH = "/";

// پینگ‌ها در این لحظه‌ها (میلی‌ثانیه بعد از شروع) برای هر دو سایت شلیک می‌شن.
// اتصال‌های قبلی قطع نمی‌شن، پس اگه بسته‌ای گم بشه، دور بعد جلوتر می‌افته.
var WAVES = [0, 800, 1900, 3500];

// حداکثر انتظار هر پینگ
var TIMEOUT = 6000;

// اگه تا این‌قدر جواب نیومد، انتخاب دستی هم نشون داده بشه (بررسی خودکار ادامه داره)
var MANUAL_AFTER = 3500;

/* =====================================================
   از اینجا به پایین نیازی به تغییر نیست
   ===================================================== */

var extra = location.search + location.hash;
var statusEl = document.getElementById("status");
var panelEl = document.getElementById("panel");
var opsEl = document.getElementById("ops");
var redirected = false, dead = false, gen = 0, pending = 0, ctrls = [], timers = [];
var ok = {}, lost = {}, miss = {}, graceT = false;

if (CAFE_NAME) {
  document.getElementById("cafeName").textContent = CAFE_NAME;
  document.title = "منو | " + CAFE_NAME;
}

function base(s) { return s.url.replace(/\/+$/, ""); }
function fullUrl(s) { return base(s) + "/" + extra; }

// دکمه‌های دستی (لینک مستقیم، پس بدون جاوااسکریپت هم کار می‌کنن)
SITES.forEach(function (s) {
  var a = document.createElement("a");
  a.className = "btn";
  a.href = fullUrl(s);
  a.textContent = s.name;
  opsEl.appendChild(a);
});
document.getElementById("retry").onclick = function (e) { e.preventDefault(); start(); };

function stop() {
  ctrls.forEach(function (c) { try { c.abort(); } catch (e) {} });
  timers.forEach(clearTimeout);
  ctrls = []; timers = [];
}

function go(s) {
  if (redirected) return;
  redirected = true;
  stop();
  statusEl.textContent = "وصل شد، در حال باز کردن منو";
  location.replace(fullUrl(s));
}

function manual(failed) {
  if (redirected) return;
  panelEl.className = "panel on";
  if (failed) {
    dead = true;
    document.body.className = "failed";
    statusEl.textContent = navigator.onLine === false ? "به اینترنت وصل نیستی" : "اتصال خودکار برقرار نشد";
  } else if (!dead) {
    statusEl.textContent = "هنوز در حال بررسی هستیم. اگه دیر شد، اینترنتت رو انتخاب کن";
  }
}

// سایت‌ها به ترتیب اولویت بررسی می‌شن. اولین سایتِ جواب‌داده انتخاب می‌شه، ولی اگه
// سایتِ بالاتری هنوز نه جواب داده و نه از دور خارج شده، تا GRACE_MS براش صبر می‌کنیم.
function settle(force) {
  if (redirected) return;
  var wait = false;
  for (var i = 0; i < SITES.length; i++) {
    if (ok[i]) {
      if (!wait || force) return go(SITES[i]);
      if (!graceT) {
        graceT = true;
        timers.push(setTimeout(function () { settle(true); }, GRACE_MS));
      }
      return;
    }
    if (!lost[i]) wait = true;
  }
}

// فقط رسیدن هدر جواب کافیه و بدنه دانلود نمی‌شه.
function ping(i, g) {
  var ctrl = window.AbortController ? new AbortController() : { abort: function () {} };
  ctrls.push(ctrl);
  timers.push(setTimeout(function () { ctrl.abort(); }, TIMEOUT));
  fetch(base(SITES[i]) + PING_PATH, {
    method: "GET",
    mode: "no-cors",
    cache: "no-store",
    credentials: "omit",
    referrerPolicy: "no-referrer",
    priority: "high",
    signal: ctrl.signal
  }).then(
    function () { if (g === gen) { ok[i] = true; settle(false); } },
    function () {
      if (g !== gen || redirected) return;
      miss[i] = (miss[i] || 0) + 1;
      if (miss[i] >= WAVES.length) { lost[i] = true; settle(false); }
      if (--pending === 0 && !Object.keys(ok).length) manual(true);
    }
  );
}

function wave(g) {
  if (redirected || g !== gen) return;
  for (var i = 0; i < SITES.length; i++) ping(i, g);
}

function start() {
  stop();
  var g = ++gen;
  dead = false;
  ok = {}; lost = {}; miss = {}; graceT = false;
  pending = SITES.length * WAVES.length;
  document.body.className = "";
  panelEl.className = "panel";
  statusEl.textContent = "در حال پیدا کردن بهترین مسیر";
  if (!window.fetch || navigator.onLine === false) return manual(true);
  WAVES.forEach(function (w) {
    if (w === 0) wave(g); else timers.push(setTimeout(function () { wave(g); }, w));
  });
  timers.push(setTimeout(function () { manual(false); }, MANUAL_AFTER));
}

// وقتی نت وصل شد یا کاربر به صفحهٔ شکست‌خورده برگشت، از اول شروع کن
window.addEventListener("online", function () { if (!redirected) start(); });
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && !redirected && dead) start();
});
// اگه مرورگر صفحه رو از حافظهٔ قبلی برگردوند، تازه‌اش کن
window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });

start();
</script>
</body>
</html>
